<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <radialGradient id="blue" cx="54%" cy="25%" r="68%">
      <stop stop-color="#a1c8d2"/>
      <stop offset=".55" stop-color="#bfd7da" stop-opacity=".9"/>
      <stop offset="1" stop-color="#c7d9d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="5%" cy="104%" r="48%">
      <stop stop-color="#edaa55"/>
      <stop offset=".4" stop-color="#f1c786" stop-opacity=".88"/>
      <stop offset="1" stop-color="#f4dab3" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="paper" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" filter="url(#grain)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#f1eee6"/>
  <rect width="100%" height="100%" fill="url(#blue)"/>
  <rect width="100%" height="100%" fill="url(#gold)"/>
  <rect width="100%" height="100%" fill="url(#paper)" opacity=".15"/>
  <svg x="64%" width="36%" height="40%" viewBox="0 0 330 210" preserveAspectRatio="xMaxYMin meet">
    <path d="M31 -8 6 8 27 35 6 63 37 78 28 113 63 116 64 152
             100 145 109 180 142 166 158 198 188 179 209 208
             235 186 260 211 284 185 312 207 335 178"
          fill="none" stroke="#334852" stroke-width="1.35" stroke-linejoin="round"/>
  </svg>
</svg>
