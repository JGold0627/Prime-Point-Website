<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Abstract peptide molecular network</title>
  <desc id="desc">Subtle molecular bonds, nodes, and hexagonal structures arranged around an open center.</desc>
  <defs>
    <linearGradient id="greenLine" x1="0" y1="0" x2="1" y2="1">
