<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shipping Information | Prime Point Health</title>
    <meta name="description" content="Confirm your Prime Point Health shipping information." />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/glp-eligibility.css" />
    <link rel="stylesheet" href="css/glp-checkout-shipping.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="glp-eligibility-page glp-checkout-page">
    <header class="site-header" data-site-header-mount aria-label="Primary navigation"></header>

    <main class="glp-eligibility-main glp-shipping-main">
      <section class="glp-eligibility-shell glp-shipping-shell" aria-labelledby="glp-shipping-title">
        <div class="glp-eligibility-status">
          <a class="glp-eligibility-back" data-shipping-back href="glp-checkout-summary.html">
            <span aria-hidden="true">&larr;</span>
            <span>Back</span>
          </a>
          <p class="glp-eligibility-stage">Checkout</p>
          <p class="glp-eligibility-count">3 of 4</p>
        </div>

        <div class="glp-eligibility-progress glp-shipping-progress" role="progressbar" aria-label="Checkout progress" aria-valuemin="1" aria-valuemax="4" aria-valuenow="3">
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span><span></span>
        </div>

        <div class="glp-shipping-intro pp-reveal">
          <p class="glp-eligibility-kicker">Delivery details</p>
          <h1 id="glp-shipping-title">Shipping information &amp; address.</h1>
          <p>Confirm where you would like eligible products shipped if treatment is prescribed. Delivery timing and availability are confirmed after provider review.</p>
        </div>

        <form class="glp-shipping-form pp-reveal" data-shipping-form novalidate>
          <div class="glp-shipping-field">
            <label for="shipping-street">Street address</label>
            <input id="shipping-street" name="street" type="text" autocomplete="street-address" placeholder="Street address" required />
          </div>

          <div class="glp-shipping-field">
            <label for="shipping-unit">Apartment or suite <span>Optional</span></label>
            <input id="shipping-unit" name="unit" type="text" autocomplete="address-line2" placeholder="Apartment or suite" />
          </div>

          <div class="glp-shipping-field">
            <label for="shipping-city">City</label>
            <input id="shipping-city" name="city" type="text" autocomplete="address-level2" placeholder="City" required />
          </div>

          <div class="glp-shipping-row">
            <div class="glp-shipping-field">
              <label for="shipping-state">State</label>
              <select id="shipping-state" name="state" autocomplete="address-level1" required>
                <option value="" selected disabled>Select state</option>
                <option value="AL">Alabama</option><option value="AK">Alaska</option><option value="AZ">Arizona</option><option value="AR">Arkansas</option>
                <option value="CA">California</option><option value="CO">Colorado</option><option value="CT">Connecticut</option><option value="DE">Delaware</option>
                <option value="DC">District of Columbia</option><option value="FL">Florida</option><option value="GA">Georgia</option><option value="HI">Hawaii</option>
                <option value="ID">Idaho</option><option value="IL">Illinois</option><option value="IN">Indiana</option><option value="IA">Iowa</option>
                <option value="KS">Kansas</option><option value="KY">Kentucky</option><option value="LA">Louisiana</option><option value="ME">Maine</option>
                <option value="MD">Maryland</option><option value="MA">Massachusetts</option><option value="MI">Michigan</option><option value="MN">Minnesota</option>
                <option value="MS">Mississippi</option><option value="MO">Missouri</option><option value="MT">Montana</option><option value="NE">Nebraska</option>
                <option value="NV">Nevada</option><option value="NH">New Hampshire</option><option value="NJ">New Jersey</option><option value="NM">New Mexico</option>
                <option value="NY">New York</option><option value="NC">North Carolina</option><option value="ND">North Dakota</option><option value="OH">Ohio</option>
                <option value="OK">Oklahoma</option><option value="OR">Oregon</option><option value="PA">Pennsylvania</option><option value="RI">Rhode Island</option>
                <option value="SC">South Carolina</option><option value="SD">South Dakota</option><option value="TN">Tennessee</option><option value="TX">Texas</option>
                <option value="UT">Utah</option><option value="VT">Vermont</option><option value="VA">Virginia</option><option value="WA">Washington</option>
                <option value="WV">West Virginia</option><option value="WI">Wisconsin</option><option value="WY">Wyoming</option>
              </select>
            </div>

            <div class="glp-shipping-field">
              <label for="shipping-zip">ZIP code</label>
              <input id="shipping-zip" name="zip" type="text" inputmode="numeric" autocomplete="postal-code" placeholder="ZIP code" pattern="[0-9]{5}(-[0-9]{4})?" maxlength="10" required />
            </div>
          </div>

          <button class="glp-eligibility-continue glp-shipping-continue" type="submit" disabled data-shipping-continue>
            <span>Continue</span>
            <span class="glp-eligibility-continue-icon" aria-hidden="true">&rarr;</span>
          </button>
        </form>
      </section>
    </main>

    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const format = params.get("format") || "injectable";
        const treatment = params.get("treatment") || (format === "tablets" ? "semaglutide-tablets" : "semaglutide");
        const form = document.querySelector("[data-shipping-form]");
        const continueButton = document.querySelector("[data-shipping-continue]");
        const requiredFields = [...form.querySelectorAll("[required]")];
        const backUrl = new URL("glp-checkout-summary.html", window.location.href);

        backUrl.searchParams.set("format", format);
        backUrl.searchParams.set("treatment", treatment);
        document.querySelector("[data-shipping-back]").href = backUrl.href;

        const updateContinue = () => {
          continueButton.disabled = !requiredFields.every((field) => field.value.trim() && field.checkValidity());
        };

        form.addEventListener("input", updateContinue);
        form.addEventListener("change", updateContinue);
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          if (continueButton.disabled || !form.checkValidity()) return;

          const address = Object.fromEntries(new FormData(form).entries());
          sessionStorage.setItem("pphGlpShipping", JSON.stringify(address));
          const nextUrl = new URL("glp-checkout-payment.html", window.location.href);
          nextUrl.searchParams.set("format", format);
          nextUrl.searchParams.set("treatment", treatment);
          window.location.href = nextUrl.href;
        });
      })();
    </script>
  </body>
</html>
