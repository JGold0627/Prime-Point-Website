<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Information | Prime Point Health</title>
    <meta name="description" content="Complete the Prime Point Health GLP-1 eligibility questionnaire." />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/glp-eligibility.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="glp-eligibility-page">
    <header class="site-header" data-site-header-mount aria-label="Primary navigation"></header>

    <main class="glp-eligibility-main glp-medical-main">
      <section class="glp-eligibility-shell glp-medical-shell" aria-labelledby="glp-medical-additional-notes-title">
        <div class="glp-eligibility-status">
          <a class="glp-eligibility-back" id="glp-medical-additional-notes-back" href="glp-eligibility-medical-current-conditions.html">
            <span aria-hidden="true">&larr;</span>
            <span>Back</span>
          </a>
          <p class="glp-eligibility-stage">Medical Information</p>
          <p class="glp-eligibility-count">15 of 15</p>
        </div>

        <div class="glp-eligibility-progress glp-medical-progress" role="progressbar" aria-label="Medical information progress" aria-valuemin="1" aria-valuemax="15" aria-valuenow="15">
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span>
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span>
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span>
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span>
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span>
        </div>

        <div class="glp-eligibility-intro glp-medical-intro glp-medical-choice-intro glp-medical-allergy-details-intro">
          <h1 id="glp-medical-additional-notes-title">Is there anything else you would like the doctor to know?</h1>
          <p>Please describe anything else you would like to communicate to the Prime Point medical team.</p>
        </div>

        <form class="glp-medical-notes-form" id="glp-additional-notes-form">
          <div class="glp-medical-notes-field">
            <label for="glp-additional-notes">Additional information for the medical team</label>
            <textarea id="glp-additional-notes" name="additionalNotes" maxlength="2000" placeholder="Write something here"></textarea>
          </div>

          <button class="glp-eligibility-continue" type="submit">
            <span id="glp-additional-notes-action-label">Nothing to Add</span>
            <span class="glp-eligibility-continue-icon" aria-hidden="true">&rarr;</span>
          </button>
        </form>
      </section>
    </main>

    <script>
      (() => {
        const form = document.getElementById("glp-additional-notes-form");
        const textarea = document.getElementById("glp-additional-notes");
        const actionLabel = document.getElementById("glp-additional-notes-action-label");
        const backLink = document.getElementById("glp-medical-additional-notes-back");
        const params = new URLSearchParams(window.location.search);
        const treatment = params.get("treatment") || "";

        if (treatment) {
          backLink.href = `glp-eligibility-medical-current-conditions.html?treatment=${encodeURIComponent(treatment)}`;
        }

        const updateActionLabel = () => {
          actionLabel.textContent = textarea.value.trim() ? "Continue" : "Nothing to Add";
        };

        textarea.addEventListener("input", updateActionLabel);

        form.addEventListener("submit", (event) => {
          event.preventDefault();

          form.dispatchEvent(new CustomEvent("glp:medical-questionnaire-complete", {
            bubbles: true,
            detail: {
              treatment,
              additionalNotes: textarea.value.trim()
            }
          }));
        });

        updateActionLabel();
      })();
    </script>
  </body>
</html>
