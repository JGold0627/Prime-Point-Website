<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Information | Prime Point Health</title>
    <meta name="description" content="Continue the Prime Point Health GLP-1 eligibility process." />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/glp-eligibility.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="glp-eligibility-page">
    <header class="site-header" data-site-header-mount aria-label="Primary navigation"></header>

    <main class="glp-eligibility-main glp-medical-main">
      <section class="glp-eligibility-shell glp-medical-shell" aria-labelledby="glp-medical-allergy-details-title">
        <div class="glp-eligibility-status">
          <a class="glp-eligibility-back" id="glp-medical-allergy-details-back" href="glp-eligibility-medical-allergies.html">
            <span aria-hidden="true">&larr;</span>
            <span>Back</span>
          </a>
          <p class="glp-eligibility-stage">Medical Information</p>
          <p class="glp-eligibility-count">12 of 15</p>
        </div>

        <div class="glp-eligibility-progress glp-medical-progress" role="progressbar" aria-label="Medical information progress" aria-valuemin="1" aria-valuemax="15" aria-valuenow="12">
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span>
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span>
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span>
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span>
          <span></span><span></span><span></span>
        </div>

        <div class="glp-eligibility-intro glp-medical-intro glp-medical-choice-intro glp-medical-allergy-details-intro">
          <h1 id="glp-medical-allergy-details-title">What are you allergic to, and what was the allergic reaction?</h1>
          <p>Your medical history helps a licensed provider evaluate whether treatment may be appropriate for you.</p>
        </div>

        <form class="glp-medical-allergy-details-form" id="glp-allergy-details-form" novalidate>
          <div class="glp-medical-allergy-entry-row">
            <div class="glp-eligibility-field">
              <label for="glp-allergy-detail">Allergy and reaction</label>
              <input id="glp-allergy-detail" name="allergyDetail" type="text" maxlength="240" placeholder="Allergy and reaction" autocomplete="off" />
            </div>
            <button class="glp-medical-allergy-add" type="button" id="glp-allergy-add">Add</button>
          </div>
          <p class="glp-medical-allergy-hint">Press Enter or select Add to include another allergy.</p>

          <ul class="glp-medical-allergy-list" id="glp-allergy-list" aria-live="polite"></ul>

          <button class="glp-eligibility-continue" type="submit">
            <span id="glp-allergy-action-label">None</span>
            <span class="glp-eligibility-continue-icon" aria-hidden="true">&rarr;</span>
          </button>
        </form>
      </section>
    </main>

    <script>
      (() => {
        const form = document.getElementById("glp-allergy-details-form");
        const input = document.getElementById("glp-allergy-detail");
        const addButton = document.getElementById("glp-allergy-add");
        const list = document.getElementById("glp-allergy-list");
        const actionLabel = document.getElementById("glp-allergy-action-label");
        const backLink = document.getElementById("glp-medical-allergy-details-back");
        const params = new URLSearchParams(window.location.search);
        const treatment = params.get("treatment") || "";
        const allergyDetails = [];

        if (treatment) {
          backLink.href = `glp-eligibility-medical-allergies.html?treatment=${encodeURIComponent(treatment)}`;
        }

        const renderAllergies = () => {
          list.replaceChildren();

          allergyDetails.forEach((detail, index) => {
            const item = document.createElement("li");
            item.className = "glp-medical-allergy-item";

            const text = document.createElement("span");
            text.textContent = detail;

            const removeButton = document.createElement("button");
            removeButton.className = "glp-medical-allergy-remove";
            removeButton.type = "button";
            removeButton.setAttribute("aria-label", `Remove ${detail}`);
            removeButton.textContent = "x";
            removeButton.addEventListener("click", () => {
              allergyDetails.splice(index, 1);
              renderAllergies();
              input.focus();
            });

            item.append(text, removeButton);
            list.append(item);
          });

          actionLabel.textContent = allergyDetails.length ? "Continue" : "None";
        };

        const addAllergy = () => {
          const detail = input.value.trim();
          if (!detail) {
            input.focus();
            return;
          }

          allergyDetails.push(detail);
          input.value = "";
          renderAllergies();
          input.focus();
        };

        addButton.addEventListener("click", addAllergy);

        input.addEventListener("keydown", (event) => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          addAllergy();
        });

        form.addEventListener("submit", (event) => {
          event.preventDefault();

          form.dispatchEvent(new CustomEvent("glp:medical-allergy-details-complete", {
            bubbles: true,
            detail: { treatment, allergyDetails: [...allergyDetails] }
          }));

          const nextPage = new URL("glp-eligibility-medical-medications.html", window.location.href);
          if (treatment) {
            nextPage.searchParams.set("treatment", treatment);
          }
          window.location.href = nextPage.href;
        });

        renderAllergies();
      })();
    </script>
  </body>
</html>
