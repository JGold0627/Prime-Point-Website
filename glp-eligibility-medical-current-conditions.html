<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Information | Prime Point Health</title>
    <meta name="description" content="Continue the Prime Point Health GLP-1 eligibility process." />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/glp-eligibility.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="glp-eligibility-page">
    <header class="site-header" data-site-header-mount aria-label="Primary navigation"></header>

    <main class="glp-eligibility-main glp-medical-main">
      <section class="glp-eligibility-shell glp-medical-shell" aria-labelledby="glp-medical-current-conditions-title">
        <div class="glp-eligibility-status">
          <a class="glp-eligibility-back" id="glp-medical-current-conditions-back" href="glp-eligibility-medical-medications.html">
            <span aria-hidden="true">&larr;</span>
            <span>Back</span>
          </a>
          <p class="glp-eligibility-stage">Medical Information</p>
          <p class="glp-eligibility-count">14 of 15</p>
        </div>

        <div class="glp-eligibility-progress glp-medical-progress" role="progressbar" aria-label="Medical information progress" aria-valuemin="1" aria-valuemax="15" aria-valuenow="14">
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span>
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span>
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span>
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span>
          <span class="is-active"></span><span class="is-active"></span><span></span>
        </div>

        <div class="glp-eligibility-intro glp-medical-intro glp-medical-choice-intro glp-medical-allergy-details-intro">
          <h1 id="glp-medical-current-conditions-title">What medical conditions do you currently have?</h1>
          <p>Your medical history helps a licensed provider evaluate whether treatment may be appropriate for you.</p>
        </div>

        <form class="glp-medical-allergy-details-form" id="glp-current-conditions-form" novalidate>
          <div class="glp-medical-allergy-entry-row">
            <div class="glp-eligibility-field">
              <label for="glp-current-condition">Medical condition</label>
              <input id="glp-current-condition" name="medicalCondition" type="text" maxlength="180" placeholder="Medical condition" autocomplete="off" />
            </div>
            <button class="glp-medical-allergy-add" type="button" id="glp-current-condition-add">Add</button>
          </div>
          <p class="glp-medical-allergy-hint">Press Enter or select Add to include another medical condition.</p>

          <ul class="glp-medical-allergy-list" id="glp-current-condition-list" aria-live="polite"></ul>

          <button class="glp-eligibility-continue" type="submit">
            <span id="glp-current-condition-action-label">None</span>
            <span class="glp-eligibility-continue-icon" aria-hidden="true">&rarr;</span>
          </button>
        </form>
      </section>
    </main>

    <script>
      (() => {
        const form = document.getElementById("glp-current-conditions-form");
        const input = document.getElementById("glp-current-condition");
        const addButton = document.getElementById("glp-current-condition-add");
        const list = document.getElementById("glp-current-condition-list");
        const actionLabel = document.getElementById("glp-current-condition-action-label");
        const backLink = document.getElementById("glp-medical-current-conditions-back");
        const params = new URLSearchParams(window.location.search);
        const treatment = params.get("treatment") || "";
        const medicalConditions = [];

        if (treatment) {
          backLink.href = `glp-eligibility-medical-medications.html?treatment=${encodeURIComponent(treatment)}`;
        }

        const renderConditions = () => {
          list.replaceChildren();

          medicalConditions.forEach((condition, index) => {
            const item = document.createElement("li");
            item.className = "glp-medical-allergy-item";

            const text = document.createElement("span");
            text.textContent = condition;

            const removeButton = document.createElement("button");
            removeButton.className = "glp-medical-allergy-remove";
            removeButton.type = "button";
            removeButton.setAttribute("aria-label", `Remove ${condition}`);
            removeButton.textContent = "x";
            removeButton.addEventListener("click", () => {
              medicalConditions.splice(index, 1);
              renderConditions();
              input.focus();
            });

            item.append(text, removeButton);
            list.append(item);
          });

          actionLabel.textContent = medicalConditions.length ? "Continue" : "None";
        };

        const addCondition = () => {
          const condition = input.value.trim();
          if (!condition) {
            input.focus();
            return;
          }

          medicalConditions.push(condition);
          input.value = "";
          renderConditions();
          input.focus();
        };

        addButton.addEventListener("click", addCondition);

        input.addEventListener("keydown", (event) => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          addCondition();
        });

        form.addEventListener("submit", (event) => {
          event.preventDefault();

          form.dispatchEvent(new CustomEvent("glp:medical-current-conditions-complete", {
            bubbles: true,
            detail: { treatment, medicalConditions: [...medicalConditions] }
          }));

          const nextPage = new URL("glp-eligibility-medical-additional-notes.html", window.location.href);
          if (treatment) {
            nextPage.searchParams.set("treatment", treatment);
          }
          window.location.href = nextPage.href;
        });

        renderConditions();
      })();
    </script>
  </body>
</html>
