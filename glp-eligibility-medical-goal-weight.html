<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Information | Prime Point Health</title>
    <meta
      name="description"
      content="Continue the Prime Point Health GLP-1 eligibility process."
    />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/glp-eligibility.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="glp-eligibility-page">
    <header class="site-header" data-site-header-mount aria-label="Primary navigation"></header>

    <main class="glp-eligibility-main glp-medical-main glp-medical-goal-weight-main">
      <section class="glp-eligibility-shell glp-medical-shell" aria-labelledby="glp-medical-goal-weight-title">
        <div class="glp-eligibility-status">
          <a class="glp-eligibility-back" id="glp-medical-goal-weight-back" href="glp-eligibility-medical-height-weight.html">
            <span aria-hidden="true">&larr;</span>
            <span>Back</span>
          </a>
          <p class="glp-eligibility-stage">Medical Information</p>
          <p class="glp-eligibility-count">10 of 15</p>
        </div>

        <div class="glp-eligibility-progress glp-medical-progress" role="progressbar" aria-label="Medical information progress" aria-valuemin="1" aria-valuemax="15" aria-valuenow="10">
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="glp-eligibility-intro glp-medical-intro glp-medical-goal-weight-intro">
          <h1 id="glp-medical-goal-weight-title">What would you like your weight to be?</h1>
          <p>Your goals help a licensed provider understand the support you are looking for.</p>
        </div>

        <form class="glp-eligibility-form glp-medical-goal-weight-form" id="glp-goal-weight-form" novalidate>
          <div class="glp-eligibility-field glp-medical-unit-field">
            <label for="glp-goal-weight-pounds">Goal weight in pounds</label>
            <input
              id="glp-goal-weight-pounds"
              name="goalWeightPounds"
              type="number"
              inputmode="decimal"
              min="1"
              max="1500"
              step="0.1"
              placeholder="Pounds"
              aria-describedby="glp-goal-weight-pounds-error"
              required
            />
            <span class="glp-medical-unit" aria-hidden="true">Lbs</span>
            <p class="glp-field-error" id="glp-goal-weight-pounds-error">Enter a goal weight from 1 to 1500 pounds.</p>
          </div>

          <button class="glp-eligibility-continue" type="submit" disabled>
            <span>Continue</span>
            <span class="glp-eligibility-continue-icon" aria-hidden="true">&rarr;</span>
          </button>
        </form>
      </section>
    </main>

    <script>
      (() => {
        const form = document.getElementById("glp-goal-weight-form");
        const goalWeight = document.getElementById("glp-goal-weight-pounds");
        const continueButton = form.querySelector(".glp-eligibility-continue");
        const backLink = document.getElementById("glp-medical-goal-weight-back");
        const params = new URLSearchParams(window.location.search);
        const treatment = params.get("treatment") || "";

        if (treatment) {
          backLink.href = `glp-eligibility-medical-height-weight.html?treatment=${encodeURIComponent(treatment)}`;
        }

        const goalWeightIsValid = () => {
          const value = Number(goalWeight.value);
          return goalWeight.value.trim() !== ""
            && Number.isFinite(value)
            && value >= 1
            && value <= 1500;
        };

        const validateGoalWeight = () => {
          const isValid = goalWeightIsValid();
          goalWeight.closest(".glp-eligibility-field").classList.toggle("has-error", !isValid);
          goalWeight.setAttribute("aria-invalid", String(!isValid));
          return isValid;
        };

        const updateContinueState = () => {
          continueButton.disabled = !goalWeightIsValid();
        };

        goalWeight.addEventListener("input", () => {
          updateContinueState();
          if (goalWeight.closest(".glp-eligibility-field").classList.contains("has-error")) {
            validateGoalWeight();
          }
        });

        goalWeight.addEventListener("blur", () => {
          if (goalWeight.value.trim()) validateGoalWeight();
        });

        form.addEventListener("submit", (event) => {
          event.preventDefault();
          if (!validateGoalWeight()) {
            goalWeight.focus();
            return;
          }

          form.dispatchEvent(new CustomEvent("glp:medical-goal-weight-complete", {
            bubbles: true,
            detail: {
              treatment,
              goalWeightPounds: Number(goalWeight.value)
            }
          }));

          const nextPage = new URL("glp-eligibility-medical-preferences.html", window.location.href);
          if (treatment) {
            nextPage.searchParams.set("treatment", treatment);
          }
          window.location.href = nextPage.href;
        });

        window.addEventListener("pageshow", updateContinueState);
        updateContinueState();
      })();
    </script>
  </body>
</html>
