<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Information | Prime Point Health</title>
    <meta name="description" content="Continue the Prime Point Health GLP-1 eligibility process." />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/glp-eligibility.css" />
  </head>
  <body class="glp-eligibility-page">
    <header class="glp-eligibility-header">
      <a class="glp-eligibility-brand" href="glp-1s.html" aria-label="Return to the Prime Point Health GLP-1 page">
        <img src="assets/brand/Logo V1.png" alt="Prime Point Health" />
      </a>
    </header>

    <main class="glp-eligibility-main glp-medical-main">
      <section class="glp-eligibility-shell glp-medical-shell" aria-labelledby="glp-medical-medications-title">
        <div class="glp-eligibility-status">
          <a class="glp-eligibility-back" id="glp-medical-medications-back" href="glp-eligibility-medical-allergies.html">
            <span aria-hidden="true">&larr;</span>
            <span>Back</span>
          </a>
          <p class="glp-eligibility-stage">Medical Information</p>
          <p class="glp-eligibility-count">13 of 15</p>
        </div>

        <div class="glp-eligibility-progress glp-medical-progress" role="progressbar" aria-label="Medical information progress" aria-valuemin="1" aria-valuemax="15" aria-valuenow="13">
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span>
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span>
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span>
          <span class="is-active"></span><span class="is-active"></span><span class="is-active"></span>
          <span class="is-active"></span><span></span><span></span>
        </div>

        <div class="glp-eligibility-intro glp-medical-intro glp-medical-choice-intro glp-medical-allergy-details-intro">
          <h1 id="glp-medical-medications-title">What medications are you currently taking?</h1>
          <p>Your medical history helps a licensed provider evaluate whether treatment may be appropriate for you.</p>
        </div>

        <form class="glp-medical-allergy-details-form" id="glp-medications-form" novalidate>
          <div class="glp-medical-allergy-entry-row">
            <div class="glp-eligibility-field">
              <label for="glp-medication">Medication</label>
              <input id="glp-medication" name="medication" type="text" maxlength="160" placeholder="Medication" autocomplete="off" />
            </div>
            <button class="glp-medical-allergy-add" type="button" id="glp-medication-add">Add</button>
          </div>
          <p class="glp-medical-allergy-hint">Press Enter or select Add to include another medication.</p>

          <ul class="glp-medical-allergy-list" id="glp-medication-list" aria-live="polite"></ul>

          <button class="glp-eligibility-continue" type="submit">
            <span id="glp-medication-action-label">None</span>
            <span class="glp-eligibility-continue-icon" aria-hidden="true">&rarr;</span>
          </button>
        </form>
      </section>
    </main>

    <script>
      (() => {
        const form = document.getElementById("glp-medications-form");
        const input = document.getElementById("glp-medication");
        const addButton = document.getElementById("glp-medication-add");
        const list = document.getElementById("glp-medication-list");
        const actionLabel = document.getElementById("glp-medication-action-label");
        const backLink = document.getElementById("glp-medical-medications-back");
        const params = new URLSearchParams(window.location.search);
        const treatment = params.get("treatment") || "";
        const medications = [];

        if (treatment) {
          backLink.href = `glp-eligibility-medical-allergies.html?treatment=${encodeURIComponent(treatment)}`;
        }

        const renderMedications = () => {
          list.replaceChildren();

          medications.forEach((medication, index) => {
            const item = document.createElement("li");
            item.className = "glp-medical-allergy-item";

            const text = document.createElement("span");
            text.textContent = medication;

            const removeButton = document.createElement("button");
            removeButton.className = "glp-medical-allergy-remove";
            removeButton.type = "button";
            removeButton.setAttribute("aria-label", `Remove ${medication}`);
            removeButton.textContent = "x";
            removeButton.addEventListener("click", () => {
              medications.splice(index, 1);
              renderMedications();
              input.focus();
            });

            item.append(text, removeButton);
            list.append(item);
          });

          actionLabel.textContent = medications.length ? "Continue" : "None";
        };

        const addMedication = () => {
          const medication = input.value.trim();
          if (!medication) {
            input.focus();
            return;
          }

          medications.push(medication);
          input.value = "";
          renderMedications();
          input.focus();
        };

        addButton.addEventListener("click", addMedication);

        input.addEventListener("keydown", (event) => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          addMedication();
        });

        form.addEventListener("submit", (event) => {
          event.preventDefault();

          form.dispatchEvent(new CustomEvent("glp:medical-medications-complete", {
            bubbles: true,
            detail: { treatment, medications: [...medications] }
          }));

          const nextPage = new URL("glp-eligibility-medical-current-conditions.html", window.location.href);
          if (treatment) {
            nextPage.searchParams.set("treatment", treatment);
          }
          window.location.href = nextPage.href;
        });

        renderMedications();
      })();
    </script>
  </body>
</html>
