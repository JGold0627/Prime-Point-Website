<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Information | Prime Point Health</title>
    <meta
      name="description"
      content="Continue the Prime Point Health GLP-1 eligibility process."
    />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/glp-eligibility.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="glp-eligibility-page">
    <header class="site-header" data-site-header-mount aria-label="Primary navigation"></header>

    <main class="glp-eligibility-main glp-medical-main glp-medical-conditions-main">
      <section class="glp-eligibility-shell glp-medical-shell" aria-labelledby="glp-medical-preferences-title">
        <div class="glp-eligibility-status">
          <a class="glp-eligibility-back" id="glp-medical-preferences-back" href="glp-eligibility-medical-goal-weight.html">
            <span aria-hidden="true">&larr;</span>
            <span>Back</span>
          </a>
          <p class="glp-eligibility-stage">Medical Information</p>
          <p class="glp-eligibility-count">11 of 15</p>
        </div>

        <div class="glp-eligibility-progress glp-medical-progress" role="progressbar" aria-label="Medical information progress" aria-valuemin="1" aria-valuemax="15" aria-valuenow="11">
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span class="is-active"></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="glp-eligibility-intro glp-medical-intro glp-medical-choice-intro glp-medical-conditions-intro">
          <h1 id="glp-medical-preferences-title">Do any of the following apply to you?</h1>
        </div>

        <form class="glp-medical-choice-form glp-medical-conditions-form" id="glp-preferences-form">
          <fieldset>
            <legend>Select all statements that apply</legend>

            <label class="glp-medical-choice glp-medical-checkbox-choice">
              <input type="checkbox" name="treatmentPreferences" value="preserve-muscle" />
              <span class="glp-medical-choice-indicator" aria-hidden="true"></span>
              <span>I want to lose fat without losing muscle</span>
            </label>

            <label class="glp-medical-choice glp-medical-checkbox-choice">
              <input type="checkbox" name="treatmentPreferences" value="increase-energy" />
              <span class="glp-medical-choice-indicator" aria-hidden="true"></span>
              <span>I want to decrease fatigue and increase my energy</span>
            </label>

            <label class="glp-medical-choice glp-medical-checkbox-choice">
              <input type="checkbox" name="treatmentPreferences" value="support-heart-health" />
              <span class="glp-medical-choice-indicator" aria-hidden="true"></span>
              <span>I'm interested in supporting my heart health</span>
            </label>

            <label class="glp-medical-choice glp-medical-checkbox-choice">
              <input type="checkbox" name="treatmentPreferences" value="improve-skin" />
              <span class="glp-medical-choice-indicator" aria-hidden="true"></span>
              <span>I'd like to improve the look and feel of my skin</span>
            </label>

            <label class="glp-medical-choice glp-medical-checkbox-choice">
              <input type="checkbox" name="treatmentPreferences" value="dosing-support" />
              <span class="glp-medical-choice-indicator" aria-hidden="true"></span>
              <span>I'm concerned about dosing correctly</span>
            </label>

            <label class="glp-medical-choice glp-medical-checkbox-choice">
              <input type="checkbox" name="treatmentPreferences" value="no-refrigeration" />
              <span class="glp-medical-choice-indicator" aria-hidden="true"></span>
              <span>I need medication that doesn't require refrigeration</span>
            </label>

            <label class="glp-medical-choice glp-medical-checkbox-choice">
              <input type="checkbox" name="treatmentPreferences" value="travel-friendly" />
              <span class="glp-medical-choice-indicator" aria-hidden="true"></span>
              <span>I'd like something travel-friendly</span>
            </label>

            <label class="glp-medical-choice glp-medical-checkbox-choice glp-medical-none-choice">
              <input type="checkbox" name="treatmentPreferences" value="none" />
              <span class="glp-medical-choice-indicator" aria-hidden="true"></span>
              <span>No, none of these apply to me</span>
            </label>
          </fieldset>

          <button class="glp-eligibility-continue glp-medical-choice-continue" type="submit" disabled>
            <span>Continue</span>
            <span class="glp-eligibility-continue-icon" aria-hidden="true">&rarr;</span>
          </button>
        </form>
      </section>
    </main>

    <script>
      (() => {
        const form = document.getElementById("glp-preferences-form");
        const choices = [...form.querySelectorAll('input[name="treatmentPreferences"]')];
        const noneChoice = choices.find((choice) => choice.value === "none");
        const continueButton = form.querySelector(".glp-eligibility-continue");
        const backLink = document.getElementById("glp-medical-preferences-back");
        const params = new URLSearchParams(window.location.search);
        const treatment = params.get("treatment") || "";

        if (treatment) {
          backLink.href = `glp-eligibility-medical-goal-weight.html?treatment=${encodeURIComponent(treatment)}`;
        }

        const updateContinueState = () => {
          continueButton.disabled = !choices.some((choice) => choice.checked);
        };

        form.addEventListener("change", (event) => {
          if (!event.target.matches('input[name="treatmentPreferences"]')) return;

          if (event.target === noneChoice && noneChoice.checked) {
            choices.forEach((choice) => {
              if (choice !== noneChoice) choice.checked = false;
            });
          } else if (event.target.checked) {
            noneChoice.checked = false;
          }

          updateContinueState();
        });

        form.addEventListener("submit", (event) => {
          event.preventDefault();
          const selectedPreferences = choices
            .filter((choice) => choice.checked)
            .map((choice) => choice.value);

          if (!selectedPreferences.length) return;

          form.dispatchEvent(new CustomEvent("glp:medical-preferences-complete", {
            bubbles: true,
            detail: { treatment, treatmentPreferences: selectedPreferences }
          }));

          const nextPage = new URL("glp-eligibility-medical-allergies.html", window.location.href);
          if (treatment) {
            nextPage.searchParams.set("treatment", treatment);
          }
          window.location.href = nextPage.href;
        });

        window.addEventListener("pageshow", updateContinueState);
        updateContinueState();
      })();
    </script>
  </body>
</html>
