<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Information | Prime Point Health</title>
    <meta
      name="description"
      content="Continue the Prime Point Health GLP-1 eligibility process."
    />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/glp-eligibility.css" />
  </head>
  <body class="glp-eligibility-page">
    <header class="glp-eligibility-header">
      <a class="glp-eligibility-brand" href="glp-1s.html" aria-label="Return to the Prime Point Health GLP-1 page">
        <img src="assets/brand/Logo V1.png" alt="Prime Point Health" />
      </a>
    </header>

    <main class="glp-eligibility-main glp-medical-main">
      <section class="glp-eligibility-shell glp-medical-shell" aria-labelledby="glp-medical-title">
        <div class="glp-eligibility-status">
          <a class="glp-eligibility-back" id="glp-medical-back" href="glp-eligibility-contact.html">
            <span aria-hidden="true">&larr;</span>
            <span>Back</span>
          </a>
          <p class="glp-eligibility-stage">Medical Information</p>
          <p class="glp-eligibility-count">1 of 15</p>
        </div>

        <div class="glp-eligibility-progress glp-medical-progress" role="progressbar" aria-label="Medical information progress" aria-valuemin="1" aria-valuemax="15" aria-valuenow="1">
          <span class="is-active"></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="glp-eligibility-intro glp-medical-intro">
          <h1 id="glp-medical-title">What&rsquo;s your birthday?</h1>
          <p>Your age helps us determine whether the Prime Point program may be appropriate for you.</p>
        </div>

        <form class="glp-eligibility-form glp-medical-form" id="glp-birthday-form" novalidate>
          <div class="glp-eligibility-field">
            <label for="glp-birthday">Birthday</label>
            <input
              id="glp-birthday"
              name="birthday"
              type="text"
              inputmode="numeric"
              autocomplete="bday"
              placeholder="MM/DD/YYYY"
              maxlength="10"
              aria-describedby="glp-birthday-error"
              required
            />
            <p class="glp-field-error" id="glp-birthday-error">Please enter a valid birthday in MM/DD/YYYY format.</p>
          </div>

          <button class="glp-eligibility-continue" type="submit" disabled>
            <span>Continue</span>
            <span class="glp-eligibility-continue-icon" aria-hidden="true">&rarr;</span>
          </button>
        </form>
      </section>
    </main>

    <script>
      (() => {
        const form = document.getElementById("glp-birthday-form");
        const birthday = document.getElementById("glp-birthday");
        const continueButton = form.querySelector(".glp-eligibility-continue");
        const backLink = document.getElementById("glp-medical-back");
        const params = new URLSearchParams(window.location.search);
        const treatment = params.get("treatment") || "";

        if (treatment) {
          backLink.href = `glp-eligibility-contact.html?treatment=${encodeURIComponent(treatment)}`;
        }

        const parseBirthday = () => {
          const match = birthday.value.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
          if (!match) return null;

          const month = Number(match[1]);
          const day = Number(match[2]);
          const year = Number(match[3]);
          const date = new Date(year, month - 1, day);
          const today = new Date();
          today.setHours(0, 0, 0, 0);

          const isRealDate = date.getFullYear() === year
            && date.getMonth() === month - 1
            && date.getDate() === day;

          return isRealDate && date <= today ? date : null;
        };

        const birthdayIsValid = () => Boolean(parseBirthday());

        const formatBirthday = () => {
          const digits = birthday.value.replace(/\D/g, "").slice(0, 8);
          if (digits.length <= 2) {
            birthday.value = digits;
          } else if (digits.length <= 4) {
            birthday.value = `${digits.slice(0, 2)}/${digits.slice(2)}`;
          } else {
            birthday.value = `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`;
          }
        };

        const updateContinueState = () => {
          continueButton.disabled = !birthdayIsValid();
        };

        const validateBirthday = () => {
          const isValid = birthdayIsValid();
          const wrapper = birthday.closest(".glp-eligibility-field");
          wrapper.classList.toggle("has-error", !isValid);
          birthday.setAttribute("aria-invalid", String(!isValid));
          return isValid;
        };

        birthday.addEventListener("input", () => {
          formatBirthday();
          updateContinueState();
          if (birthday.closest(".glp-eligibility-field").classList.contains("has-error")) {
            validateBirthday();
          }
        });

        birthday.addEventListener("blur", () => {
          if (birthday.value.trim()) {
            validateBirthday();
          }
        });

        window.addEventListener("pageshow", updateContinueState);
        updateContinueState();

        form.addEventListener("submit", (event) => {
          event.preventDefault();
          if (!validateBirthday()) {
            birthday.focus();
            return;
          }

          const nextPage = new URL("glp-eligibility-medical-sex.html", window.location.href);
          if (treatment) {
            nextPage.searchParams.set("treatment", treatment);
          }
          window.location.href = nextPage.href;
        });
      })();
    </script>
  </body>
</html>
