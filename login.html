<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In | Prime Point Health</title>
    <meta
      name="description"
      content="Access your Prime Point Health member account."
    />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="login-page">
    <header class="site-header" data-site-header-mount aria-label="Primary navigation"></header>

    <main class="login-stage">
      <section class="login-panel" aria-labelledby="login-title">
        <p class="login-kicker">Member access</p>
        <h1 id="login-title">Log in</h1>
        <p class="login-account-prompt">
          Need a Prime Point account?
          <a href="create-account.html">Create an account</a>
        </p>

        <form class="login-form" action="#" method="post" data-login-form>
          <div class="login-field">
            <label for="login-email">Email address</label>
            <input
              id="login-email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>

          <div class="login-field">
            <div class="login-password-label">
              <label for="login-password">Password</label>
              <button
                class="login-password-toggle"
                type="button"
                aria-controls="login-password"
                aria-pressed="false"
                data-password-toggle
              >
                Show
              </button>
            </div>
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>

          <label class="login-remember">
            <input name="remember" type="checkbox" />
            <span>Keep me logged in</span>
          </label>

          <button class="button button-primary login-submit" type="submit">Log in</button>
          <p class="login-form-note" aria-live="polite"></p>
        </form>

        <nav class="login-help" aria-label="Login help">
          <a href="forgot-username.html">Forgot username?</a>
          <a href="forgot-password.html">Forgot password?</a>
          <a href="contact.html#contact-form">Can't log in?</a>
        </nav>
      </section>
    </main>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
