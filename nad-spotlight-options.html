<style>
#nad-light-options .pp-scene{--pp-ivory:#f6f4f0;--pp-ink:#0f2337;color-scheme:light;position:relative;overflow:hidden;min-height:570px;background:var(--pp-ivory);color:var(--pp-ink);font-family:Arial,sans-serif}
#nad-light-options .pp-scene *{box-sizing:border-box}
#nad-light-options .pp-heading{position:relative;z-index:5;margin:0;padding:35px 22px 0;text-align:center;font:400 clamp(26px,4.5vw,36px)/1.2 Georgia,serif;letter-spacing:-.035em;color:var(--pp-ink)}
#nad-light-options .pp-stage{position:relative;isolation:isolate;width:min(100%,600px);height:455px;margin:0 auto}
#nad-light-options .pp-bottle{position:absolute;z-index:4;top:54px;left:50%;width:240px;height:360px;transform:translateX(-50%);object-fit:contain;filter:drop-shadow(0 12px 9px rgba(20,35,45,.09))}
#nad-light-options .pp-light,#nad-light-options .pp-floor,#nad-light-options .pp-base,#nad-light-options .pp-detail{position:absolute;pointer-events:none}
#nad-light-options .pp-floor{z-index:1;left:50%;top:390px;width:290px;height:55px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(37,46,52,.16),rgba(47,60,68,.04) 43%,transparent 70%);filter:blur(5px)}
#nad-light-options .pp-gallery .pp-light{z-index:0;top:0;left:10%;width:80%;height:425px;background:linear-gradient(120deg,transparent 10%,rgba(255,255,255,.95) 37%,rgba(255,255,255,.9) 50%,rgba(234,229,214,.35) 75%,transparent 94%);clip-path:polygon(37% 0,52% 0,100% 100%,0 100%);filter:blur(20px)}
#nad-light-options .pp-gallery .pp-light{background:none;clip-path:none;filter:blur(15px)}
#nad-light-options .pp-gallery .pp-light::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 10%,rgba(255,255,255,.94) 37%,rgba(255,255,255,.85) 50%,rgba(234,229,214,.25) 75%,transparent 94%);clip-path:polygon(37% 0,52% 0,100% 100%,0 100%)}
#nad-light-options .pp-gallery .pp-detail{top:52px;left:50%;width:330px;height:340px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(255,255,255,.9) 4%,rgba(255,255,255,.6) 35%,transparent 72%)}
#nad-light-options .pp-gallery .pp-floor{width:320px;height:60px;left:57%;transform:translateX(-50%) rotate(5deg)}
#nad-light-options .pp-gallery .pp-base{top:398px;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(199,191,176,.26),transparent)}
#nad-light-options .pp-halo .pp-light{top:19px;left:50%;width:390px;height:390px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(255,255,255,.94) 14%,rgba(246,229,188,.7) 40%,rgba(218,192,137,.19) 53%,transparent 71%);filter:blur(11px)}
#nad-light-options .pp-halo .pp-detail{top:51px;left:50%;width:300px;height:316px;transform:translateX(-50%);border-radius:50%;border:1px solid rgba(194,159,89,.24);box-shadow:0 0 28px rgba(213,178,100,.12),inset 0 0 20px rgba(255,255,255,.9)}
#nad-light-options .pp-halo .pp-floor{background:radial-gradient(ellipse,rgba(171,134,61,.23),rgba(200,168,103,.09) 35%,transparent 72%)}
#nad-light-options .pp-glass .pp-light{top:4px;left:50%;width:440px;height:400px;transform:translateX(-50%);background:radial-gradient(ellipse,white 10%,rgba(220,233,238,.65) 42%,transparent 69%);filter:blur(16px)}
#nad-light-options .pp-glass .pp-bottle{top:25px}
#nad-light-options .pp-glass .pp-base{z-index:2;top:350px;left:50%;width:280px;height:66px;transform:translateX(-50%);border-radius:50% / 27%;border:1px solid rgba(178,192,198,.52);background:linear-gradient(100deg,rgba(220,229,232,.75),rgba(255,255,255,.94) 28%,rgba(228,236,238,.68) 58%,rgba(255,255,255,.9) 80%,rgba(196,213,220,.7));box-shadow:0 16px 22px -12px rgba(27,49,60,.24),inset 1px -2px 4px rgba(160,178,185,.13)}
#nad-light-options .pp-glass .pp-base::before{content:"";position:absolute;left:-1px;top:-1px;width:100%;height:33px;border-radius:50%;border:1px solid rgba(255,255,255,.9);background:linear-gradient(115deg,#eff5f5,#ffffff 45%,#dae5e9);box-shadow:0 2px 3px rgba(138,159,170,.12)}
#nad-light-options .pp-glass .pp-detail{z-index:3;top:353px;left:50%;width:155px;height:23px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(31,50,60,.23),transparent 70%);filter:blur(3px)}
#nad-light-options .pp-glass .pp-floor{top:403px;width:335px;height:43px}
#nad-light-options .pp-alcove .pp-base{z-index:0;top:10px;left:50%;width:300px;height:400px;transform:translateX(-50%);border-radius:160px 160px 4px 4px;background:radial-gradient(ellipse at 50% 9%,#fff 1%,#faf8f2 32%,#ebe7dd 84%);box-shadow:inset 8px 2px 13px rgba(90,80,58,.08),inset -5px 0 12px rgba(90,80,58,.04),0 1px 0 rgba(255,255,255,.9)}
#nad-light-options .pp-alcove .pp-light{z-index:1;top:22px;left:50%;width:230px;height:345px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.48) 35%,transparent 95%);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);filter:blur(12px)}
#nad-light-options .pp-alcove .pp-detail{z-index:2;top:405px;left:50%;width:315px;height:8px;transform:translateX(-50%);border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(202,195,180,.33));box-shadow:0 5px 9px rgba(103,94,77,.07)}
#nad-light-options .pp-alcove .pp-floor{z-index:3;top:388px;width:255px;height:34px}
@media(max-width:420px){#nad-light-options .pp-scene{min-height:545px}#nad-light-options .pp-heading{padding-top:30px}#nad-light-options .pp-stage{height:445px}#nad-light-options .pp-halo .pp-light{width:340px}#nad-light-options .pp-halo .pp-detail{width:275px}#nad-light-options .pp-alcove .pp-base{width:270px}#nad-light-options .pp-alcove .pp-detail{width:285px}}
</style>
